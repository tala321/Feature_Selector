{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feature Selector</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0f7fa, #f0f4f8);
            animation: bgShift 8s infinite alternate;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        @keyframes bgShift {
            0% { background: linear-gradient(135deg, #e0f7fa, #f0f4f8); }
            100% { background: linear-gradient(135deg, #d6eaf8, #d5dbdb); }
        }

        .logo-wrapper {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 8px solid #154360;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(21, 67, 96, 0.3);
            background: radial-gradient(circle at center, #ffffff 0%, #d6eaf8 100%);
            animation: fadeIn 1.5s ease-in;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.8rem;
            margin-bottom: 30px;
            animation: slideDown 1s ease-out;
        }

        .btn {
            background-color: #3498db;
            color: white;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 2s ease-in;
            text-decoration: none;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        @keyframes slideDown {
            from { transform: translateY(-60px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .side-decor {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 80px;
            background: repeating-linear-gradient(
                180deg,
                #3498db 0px,
                #3498db 4px,
                transparent 4px,
                transparent 12px
            );
            opacity: 0.2;
        }

        .side-left {
            left: 0;
        }

        .side-right {
            right: 0;
        }

        .emoji-strip {
            position: absolute;
            bottom: 20px;
            font-size: 1.5rem;
            color: #2c3e50;
            animation: fadeIn 3s ease-in;
        }
    </style>
</head>
<body>
    <div class="side-decor side-left"></div>
    <div class="side-decor side-right"></div>

    <div class="logo-wrapper">
        <img src="{% static 'core/images/logo.png' %}" alt="Logo">
    </div>

    <h1>Welcome to the Smart Feature Selector</h1>

    <a href="http://localhost:3000/upload" class="btn">📁 Upload Dataset</a>

</body>
</html>
